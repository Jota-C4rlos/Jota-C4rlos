<title>Orquestrador Network</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;600&family=JetBrains+Mono:wght@400;600;700&family=Mulish:wght@400;600;800&display=swap">
<style>
/* Layout: one screen. A living graph fills the viewport; a thin HUD on top,
   a dock at the bottom, and a detail panel that takes the bottom of a
   portrait screen or the right side of a landscape one. Single dark look. */
:root{
  color-scheme: dark;
  --ground:#161616; --raise:#262626; --ink:#f4f3f2;
  --mute:rgba(244,243,242,.68); --line:rgba(244,243,242,.22); --faint:rgba(244,243,242,.1);
  --display:'Archivo','Helvetica Neue',Arial,sans-serif;
  --body:'Mulish','Segoe UI','Helvetica Neue',Arial,sans-serif;
  --mono:'JetBrains Mono',Consolas,ui-monospace,monospace;
  --gutter:clamp(16px,3vw,40px);
}
html,body{height:100%}
body{background:var(--ground);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.4;overflow:hidden}
button{font:inherit;color:inherit}
button:focus-visible{outline:2px solid #fad305;outline-offset:2px}
#app{position:relative;height:100%;overflow:hidden}
#stage{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none;cursor:grab}
.label{font-family:var(--mono);font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--mute)}

.top{position:absolute;left:0;right:0;top:0;padding:20px var(--gutter) 0;display:flex;justify-content:space-between;align-items:flex-start;gap:16px;pointer-events:none}
.top > div{min-width:0}
.top h1{margin:6px 0 0;font-family:var(--display);font-weight:600;font-size:clamp(22px,3.4vw,38px);line-height:1.1;text-wrap:balance}
.top p{margin:6px 0 0;font-size:clamp(13px,1.5vw,16px);color:var(--mute)}
.live{flex:none;display:flex;align-items:center;gap:8px;font-family:var(--mono);font-size:12px;letter-spacing:.12em;text-transform:uppercase;white-space:nowrap}
.live i{width:8px;height:8px;background:var(--ink);border-radius:50%;animation:blink 1.6s ease-in-out infinite}
@keyframes blink{50%{opacity:.25}}

.hint{position:absolute;left:var(--gutter);font-family:var(--mono);font-size:11px;letter-spacing:.06em;color:var(--mute);pointer-events:none}

.dock{position:absolute;left:0;right:0;bottom:0;padding:0 var(--gutter) 20px;display:flex;flex-direction:column;gap:10px}
.needs{display:flex;align-items:center;justify-content:space-between;gap:16px;min-height:56px;padding:8px 22px 8px 16px;border:0;background:var(--ink);color:var(--ground);cursor:pointer;text-align:left;clip-path:polygon(0 0,calc(100% - 16px) 0,100% 27.7px,100% 100%,0 100%);transition:opacity .15s}
.needs:hover{opacity:.88}
.needs.quiet{background:transparent;color:var(--mute);border:1px solid var(--line);clip-path:none}
.needs b{font-weight:800;font-size:clamp(15px,1.8vw,19px)}
.needs .gate{flex:none;font-family:var(--mono);font-size:13px;font-weight:700;padding:3px 7px;background:var(--ground);color:var(--ink);margin-right:12px}
.needs .tag{flex:none;font-family:var(--mono);font-size:11px;letter-spacing:.12em;text-transform:uppercase}
.needs span.what{display:flex;align-items:center;min-width:0}
.chips{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:1 0 118px;display:flex;flex-direction:column;gap:2px;padding:10px 12px;border:1px solid var(--line);background:rgba(22,22,22,.78);cursor:pointer;text-align:left;transition:border-color .15s,background .15s}
.chip:hover{border-color:var(--ink)}
.chip[aria-pressed="true"]{border-color:var(--ink);background:var(--raise)}
.chip strong{font-size:18px;font-weight:800;white-space:nowrap}
.chip small{font-size:12px;color:var(--mute);white-space:nowrap}

.panel{position:absolute;box-sizing:border-box;display:flex;flex-direction:column;gap:14px;padding:16px 18px 18px;background:rgba(22,22,22,.95);border:1px solid var(--line);min-width:0}
.panel-bar{display:flex;align-items:center;justify-content:space-between;gap:10px}
.tabs{display:flex;gap:2px;overflow-x:auto;scrollbar-width:none;min-width:0}
.tabs::-webkit-scrollbar{display:none}
.tab{flex:none;display:flex;align-items:center;gap:7px;min-height:40px;padding:0 9px;border:0;border-bottom:2px solid transparent;background:transparent;color:var(--mute);cursor:pointer;font-family:var(--mono);font-size:13px;font-weight:600}
.tab:hover{color:var(--ink)}
.tab[aria-pressed="true"]{color:var(--ink);border-bottom-color:var(--ink)}
.tab i{width:11px;height:11px;border-radius:50%;border:2px solid var(--c);box-sizing:border-box}
.tab i.on{background:var(--c)}
.close{flex:none;min-height:40px;padding:0 14px;border:1px solid var(--line);background:transparent;cursor:pointer;font-size:14px;font-weight:700}
.close:hover{border-color:var(--ink)}
.panel-head{display:flex;gap:14px;align-items:flex-start}
.panel-head i{flex:none;width:22px;height:22px;margin-top:8px;border-radius:50%;border:3px solid var(--c);box-sizing:border-box}
.panel-head i.on{background:var(--c)}
.panel-head h2{margin:2px 0 0;font-family:var(--display);font-weight:600;font-size:clamp(24px,3vw,34px);line-height:1.1}
.panel-head .state{margin-top:4px;font-size:15px;font-weight:800}
.rows{flex:1;min-height:0;overflow:auto;padding-right:4px}
.rows h3{margin:18px 0 0;padding-bottom:8px;border-bottom:1px solid var(--line);font-family:var(--mono);font-size:12px;font-weight:400;letter-spacing:.12em;text-transform:uppercase;color:var(--mute)}
.rows h3:first-child{margin-top:0}
.row{display:flex;align-items:baseline;gap:14px;padding:9px 0;border-bottom:1px solid var(--faint)}
.row .k{flex:none;width:84px;font-family:var(--mono);font-size:13px;color:var(--mute);font-variant-numeric:tabular-nums}
.row .v{flex:1;min-width:0;font-size:15px;overflow-wrap:anywhere}
.row .v small{display:block;font-size:13px;color:var(--mute)}
.row .m{flex:none;font-family:var(--mono);font-size:12px;color:var(--mute)}
.row a.m{color:var(--ink);text-decoration:underline;text-underline-offset:3px}
.row.now .v{font-weight:800}
.idle .live i{animation:none;opacity:.35}

.tip{position:absolute;z-index:5;max-width:260px;padding:10px 12px;background:var(--ink);color:var(--ground);font-size:13px;line-height:1.4;pointer-events:none}
.tip b{display:block;font-weight:800}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip-path:inset(50%)}
@media (prefers-reduced-motion: reduce){.live i{animation:none}.needs,.chip{transition:none}}
</style>

</head>

  <div class="tip" id="tip" hidden></div>
</div>

      ctx.beginPath(); ctx.moveTo(n.x + d[0] * b, n.y + d[1] * (b - q)); ctx.lineTo(n.x + d[0] * b, n.y + d[1] * b); ctx.lineTo(n.x + d[0] * (b - q), n.y + d[1] * b); ctx.stroke();
    });
  }
  ctx.textAlign = 'center'; ctx.textBaseline = 'alphabetic';
  ctx.fillStyle = INK; ctx.font = '700 ' + Math.round(12 * geo.s + 2) + "px 'JetBrains Mono', monospace";
  ctx.fillText(n.id, n.x, n.y + r + 20 * geo.s + 4);
  ctx.fillStyle = active ? INK : 'rgba(244,243,242,0.68)'; ctx.font = (active ? '800 ' : '400 ') + Math.round(10 * geo.s + 2) + "px 'Mulish', sans-serif";
  ctx.fillText(n.agent.label, n.x, n.y + r + 36 * geo.s + 5);
}
function drawFile(n, f) {
  ctx.shadowColor = n.color; ctx.shadowBlur = 8;
  if (n.course) { ctx.strokeStyle = n.color; ctx.lineWidth = 1.5; ctx.strokeRect(n.x - 4, n.y - 4, 8, 8); }
  else { ctx.fillStyle = n.color; ctx.fillRect(n.x - 3.5, n.y - 3.5, 7, 7); }
  ctx.shadowBlur = 0;
  if (f && (f === n || f.id === n.parent)) {
    var p = byId[n.parent], left = n.x < p.x;
    ctx.fillStyle = 'rgba(244,243,242,0.9)'; ctx.font = "400 11px 'JetBrains Mono', monospace"; ctx.textAlign = left ? 'right' : 'left'; ctx.textBaseline = 'middle';
    ctx.fillText(n.name, n.x + (left ? -10 : 10), n.y);
  }
}

/* ---------- Pointer: hover, drag a node, pan the plane, zoom ---------- */
function pick(wx, wy) {
  var best = null, bd = 1e9;
  nodes.forEach(function (n) {
    var d = Math.hypot(n.x - wx, n.y - wy), reach = (n.type === 'file' ? 12 : n.r + 10);
    if (n.type === 'jose' || n.type === 'client') { if (Math.abs(n.x - wx) < n.w / 2 + 6 && Math.abs(n.y - wy) < n.h / 2 + 6) { d = 0; reach = 1; } else { return; } }
    if (d < reach && d < bd) { best = n; bd = d; }
  });
  return best;
}
function local(e) { var r = canvas.getBoundingClientRect(); return { x: e.clientX - r.left, y: e.clientY - r.top }; }
function showTip(lines, sx, sy, above) {
  tip.textContent = '';
  lines.forEach(function (t, i) { var el = document.createElement(i === 0 ? 'b' : 'div'); el.textContent = t; tip.appendChild(el); });
  tip.hidden = false;
  var tw = tip.offsetWidth, th = tip.offsetHeight;
  tip.style.left = clamp(sx - tw / 2, 8, W - tw - 8) + 'px';
  tip.style.top = (above ? sy - th - 8 : (sy + th + 8 > H ? sy - th - 60 : sy)) + 'px';
}
function hideTip() { tip.hidden = true; }
canvas.addEventListener('pointermove', function (e) {
  var p = local(e), w = toWorld(p.x, p.y);
  cursor = w;
  if (drag) { drag.x = w.x; drag.y = w.y; drag.vx = drag.vy = 0; moved += Math.abs(e.movementX || 0) + Math.abs(e.movementY || 0); hideTip(); return; }
  if (pan) { view.tx = pan.tx + (p.x - pan.x); view.ty = pan.ty + (p.y - pan.y); moved += Math.abs(e.movementX || 0) + Math.abs(e.movementY || 0); return; }
  hover = pick(w.x, w.y);
  canvas.style.cursor = hover ? 'pointer' : 'grab';
  if (hover && hover.tip) { var sp = toScreen(hover.x, hover.y); showTip(hover.tip.concat(hover.open ? ['Clique para abrir'] : []), sp.x, sp.y + (hover.r + 44) * view.k); } else { hideTip(); }
});
canvas.addEventListener('pointerdown', function (e) {
  var p = local(e), w = toWorld(p.x, p.y), n = pick(w.x, w.y);
  moved = 0; canvas.setPointerCapture(e.pointerId);
  if (n) { drag = n; hover = n; } else { pan = { x: p.x, y: p.y, tx: view.tx, ty: view.ty }; canvas.style.cursor = 'grabbing'; }
});
function release() {
  if (drag && moved < 6) { var n = drag; drag = null; if (n.type === 'core') { openPanel('log'); } else if (n.open) { openPanel(n.open); } }
  drag = null; pan = null; canvas.style.cursor = hover ? 'pointer' : 'grab';
}
canvas.addEventListener('pointerup', release);
canvas.addEventListener('pointercancel', release);
canvas.addEventListener('pointerleave', function () { if (!drag && !pan) { hover = null; cursor = null; hideTip(); } });
canvas.addEventListener('wheel', function (e) {
  e.preventDefault();
  var p = local(e), before = toWorld(p.x, p.y);
  view.k = clamp(view.k * Math.exp(-e.deltaY * 0.0012), 0.6, 2.4);
  var after = toScreen(before.x, before.y);
  view.tx += p.x - after.x; view.ty += p.y - after.y;
}, { passive: false });
canvas.addEventListener('dblclick', function (e) { var p = local(e), w = toWorld(p.x, p.y); if (!pick(w.x, w.y)) { view.k = 1; view.tx = 0; view.ty = 0; } });

/* ---------- Panel and dock ---------- */
function agentOf(id) { for (var i = 0; i < STATE.agents.length; i++) { if (STATE.agents[i].id === id) { return STATE.agents[i]; } } return null; }
function el(tag, cls, text) { var e = document.createElement(tag); if (cls) { e.className = cls; } if (text !== undefined) { e.textContent = text; } return e; }
function fillRows(rows) {
  var box = $('rows'), at = box.scrollTop; box.textContent = '';
  rows.forEach(function (r) {
    if (r[0] === 'h') { box.appendChild(el('h3', '', r[1])); return; }
    var row = el('div', 'row' + (r[3] === 'agora' ? ' now' : ''));
    row.appendChild(el('span', 'k', r[0]));
    var v = el('span', 'v', r[1]); if (r[2]) { v.appendChild(el('small', '', r[2])); } row.appendChild(v);
    if (r[3] && r[4] && /^(obsidian|file):/i.test(r[4])) { var ln = el('a', 'm', r[3]); ln.href = r[4]; row.appendChild(ln); }
    else if (r[3]) { row.appendChild(el('span', 'm', r[3])); }
    box.appendChild(row);
  });
  box.scrollTop = at;
}
function openPanel(id, keep) {
  var a = agentOf(id), p = a ? null : STATE.panels[id];
  if (!a && !p) { return; }
  open = id; hideTip();
  var dot = $('pDot');
  if (a) {
    dot.hidden = false; dot.style.setProperty('--c', COLORS[a.id]); dot.className = a.state === 'livre' ? '' : 'on';
    $('pKicker').textContent = 'Agente · ' + (a.role || ''); $('pName').textContent = a.id; $('pState').textContent = a.headline || a.label || ''; fillRows(a.rows || []);
  } else {
    dot.hidden = true;
    $('pKicker').textContent = p.kicker || ''; $('pName').textContent = p.title || ''; $('pState').textContent = p.state || ''; fillRows(p.rows || []);
  }
  panel.hidden = false;
  Array.prototype.forEach.call(document.querySelectorAll('[data-open]'), function (b) { b.setAttribute('aria-pressed', b.getAttribute('data-open') === id ? 'true' : 'false'); });
  if (!keep) { view.k = 1; view.tx = 0; view.ty = 0; }
  measure();
}
function closePanel() {
  open = null; panel.hidden = true;
  Array.prototype.forEach.call(document.querySelectorAll('[data-open]'), function (b) { b.setAttribute('aria-pressed', 'false'); });
  measure();
}
$('close').addEventListener('click', closePanel);
document.addEventListener('keydown', function (e) { if (e.key === 'Escape' && open) { closePanel(); } });

function buildChrome() {
  var tabs = $('tabs'), sr = $('srnav'), needsBtn = $('needs'), chips = $('chips');
  tabs.textContent = ''; sr.textContent = ''; needsBtn.textContent = ''; chips.textContent = '';
  STATE.agents.forEach(function (a) {
    var t = el('button', 'tab'); t.type = 'button'; t.setAttribute('data-open', a.id); t.setAttribute('aria-pressed', open === a.id ? 'true' : 'false');
    var i = el('i', a.state === 'livre' ? '' : 'on'); i.style.setProperty('--c', COLORS[a.id]); t.appendChild(i); t.appendChild(document.createTextNode(a.id));
    t.addEventListener('click', function () { openPanel(a.id); }); tabs.appendChild(t);
    var s = el('button', '', 'Abrir ' + a.id + ': ' + (a.headline || a.label || '')); s.type = 'button'; s.addEventListener('click', function () { openPanel(a.id); }); sr.appendChild(s);
  });
  if (STATE.needs.count) {
    var what = el('span', 'what'); what.appendChild(el('span', 'gate', STATE.needs.gate || '—')); what.appendChild(el('b', '', STATE.needs.text || ''));
    needsBtn.appendChild(what); needsBtn.appendChild(el('span', 'tag', 'Needs you · ' + STATE.needs.count));
  } else { needsBtn.appendChild(el('b', '', 'Nada pendente')); }
  needsBtn.classList.toggle('quiet', !STATE.needs.count);
  ['gates', 'tasks', 'log', 'generation', 'academy'].forEach(function (key) {
    var p = STATE.panels[key]; if (!p || !p.chip) { return; }
    var c = el('button', 'chip'); c.type = 'button'; c.setAttribute('data-open', key); c.setAttribute('aria-pressed', open === key ? 'true' : 'false');
    c.appendChild(el('span', 'label', p.chip[0])); c.appendChild(el('strong', '', p.chip[1])); c.appendChild(el('small', '', p.chip[2] || ''));
    c.addEventListener('click', function () { if (open === key) { closePanel(); } else { openPanel(key); } });
    c.addEventListener('pointerenter', function () { if (!p.tip) { return; } var r = c.getBoundingClientRect(), ar = app.getBoundingClientRect(); showTip(p.tip, r.left - ar.left + r.width / 2, r.top - ar.top, true); });
    c.addEventListener('pointerleave', hideTip);
    chips.appendChild(c);
  });
}
$('needs').addEventListener('click', function () { openPanel('needs'); });

/* ---------- Applying a state, and reloading it from estado.js ---------- */
function apply(st, demo) {
  STATE = st; isDemo = demo;
  $('pTitle').textContent = st.project.title || '';
  $('pLine').textContent = st.project.line || '';
  $('clock').textContent = (st.session === 'encerrada' ? 'Parado · ' : 'Live · ') + (st.clock || '');
  app.classList.toggle('idle', st.session === 'encerrada');
  hint.textContent = 'arraste os nós · role para aproximar · clique para abrir' + (demo ? ' · dados de demonstração' : '');
  buildGraph(); buildChrome();
  if (open) { if (agentOf(open) || STATE.panels[open]) { openPanel(open, true); } else { closePanel(); } }
  measure();
}
function poll() {
  var sc = document.createElement('script');
  sc.src = 'estado.js?t=' + Date.now();
  sc.onload = function () {
    sc.remove();
    var st = window.ORQUESTRADOR_STATE; if (!st) { return; }
    var j = JSON.stringify(st); if (j === lastJson) { return; }
    lastJson = j; apply(normalize(JSON.parse(j)), false);
  };
  sc.onerror = function () { sc.remove(); };
  document.head.appendChild(sc);
}

/* ---------- Loop ---------- */
var last = 0;
function frame(ms) {
  var time = ms / 1000, dt = Math.min(0.05, time - last || 0.016); last = time;
  step(dt, time); draw(time);
  requestAnimationFrame(frame);
}
window.addEventListener('resize', measure);
if (window.ResizeObserver) { new ResizeObserver(measure).observe(app); }
apply(normalize(JSON.parse(JSON.stringify(DEMO))), true);
if (document.fonts && document.fonts.ready) { document.fonts.ready.then(measure); }
if (location.protocol === 'file:') { poll(); setInterval(poll, 2000); }
requestAnimationFrame(frame);
})();
</script>
